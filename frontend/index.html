<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="FitLens checks how well your resume matches a job description, whether it is ATS-friendly, and lets you edit and download an ATS-friendly version." />
    <meta name="theme-color" content="#f7f3ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161512" media="(prefers-color-scheme: dark)" />
    <title>FitLens — Resume Fit & ATS Checker</title>
    <link rel="canonical" href="https://resumefitlens.vercel.app/" />
    <!-- Link previews (LinkedIn, WhatsApp, X, Slack): image must be an absolute URL -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FitLens" />
    <meta property="og:url" content="https://resumefitlens.vercel.app/" />
    <meta property="og:title" content="FitLens — Is your resume ready for this job?" />
    <meta property="og:description" content="Free for Indian students and freshers: see how well your resume matches a job, pass ATS checks, check campus eligibility and build an ATS-friendly resume." />
    <meta property="og:image" content="https://resumefitlens.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FitLens: match score, ATS check, eligibility and resume builder" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FitLens — Is your resume ready for this job?" />
    <meta name="twitter:description" content="Free for Indian students and freshers: see how well your resume matches a job, pass ATS checks, check campus eligibility and build an ATS-friendly resume." />
    <meta name="twitter:image" content="https://resumefitlens.vercel.app/og-image.png" />
    <!-- Apply the saved/system theme before first paint to avoid a flash -->
    <script>
      try {
        const saved = localStorage.getItem('fitlens-theme');
        const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      } catch {
        /* storage unavailable: keep light */
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,500..800,50..100&family=Inter:wght@400..700&family=JetBrains+Mono:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
