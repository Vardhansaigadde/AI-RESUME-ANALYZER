services:
  # FastAPI machine learning backend
  - type: web
    name: resume-analyzer-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # The frontend calls the API through Vercel's same-origin /api rewrite,
      # so CORS is only needed for direct browser calls from these origins.
      - key: CORS_ORIGINS
        value: "https://resumefitlens.vercel.app"
