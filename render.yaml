services:
  # FastAPI Machine Learning Backend Service
  - type: web
    name: resume-analyzer-backend
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: CORS_ORIGINS
        value: "*"
