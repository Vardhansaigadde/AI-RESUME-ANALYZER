# Blueprint for the FastAPI backend.
#
# The live service (AI-RESUME-ANALYZER, https://ai-resume-analyzer-xb45.onrender.com)
# was created manually in the Render dashboard, not from this blueprint, so edits
# here do not change it: set environment variables in the dashboard instead.
# This file mirrors that service so it can be recreated with New + > Blueprint.
services:
  - type: web
    name: AI-RESUME-ANALYZER
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # The Vercel frontend calls this API directly (VITE_API_BASE_URL), so its
      # origin must be allowed here.
      - key: CORS_ORIGINS
        value: "https://resumefitlens.vercel.app"
      # Optional: free Adzuna developer key for on-site jobs in the job search
      # (https://developer.adzuna.com). Without it, only remote jobs are shown.
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
