name: Keep backend awake

# Render's free plan stops the service after ~15 minutes without traffic, and
# the next visitor then waits 30-60 s. Pinging the health check every 10
# minutes from 02:00 to 18:59 UTC (07:30-00:29 IST) keeps it warm during the
# day while using ~510 of the 750 free instance hours per month.
# Note: GitHub pauses scheduled workflows after 60 days without repository
# activity; re-enable it from the Actions tab if that happens.

on:
  schedule:
    - cron: "*/10 2-18 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health check
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 10 https://ai-resume-analyzer-xb45.onrender.com/
